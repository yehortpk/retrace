spring:
  application:
    name: retrace
  docker:
    compose:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/projectmemory}
    username: ${DB_USER:projectmemory}
    password: ${DB_PASSWORD:projectmemory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

retrace:
  storage:
    root: ${STORAGE_ROOT:./storage}

server:
  port: 8080
