spring:
  application:
    name: retrace
  docker:
    compose:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retrace}
    username: ${DB_USER:retrace}
    password: ${DB_PASSWORD:retrace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

retrace:
  storage:
    root: ${STORAGE_ROOT:./storage}
  artifacts:
    project-storage-limit: 500MB # cumulative size of all artifact versions per project

server:
  port: 8080
