<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Retrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-brand">
    <span class="brand-mark brand-mark--large"><svg class="icon" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.3-3.2"/><path d="M4.5 2.5v2.5H7"/></svg></span>
    <span>Retrace</span>
  </div>

  <form class="auth-card" method="post">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Sign in</h1>
    </div>
    <div class="field">
      <label class="field__label" for="username">Username</label>
      <input class="input input--large" id="username" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input class="input input--large" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="button button--primary button--large auth-card__submit" type="submit">Sign in</button>
  </form>

  <p class="auth-switch">New here? <a class="text-link" href="register.html">Create an account</a></p>
</main>
</body>
</html>
