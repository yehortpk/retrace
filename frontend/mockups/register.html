<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Retrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../src/styles/tokens.css">
<link rel="stylesheet" href="../src/styles/base.css">
<link rel="stylesheet" href="../src/styles/controls.css">
<link rel="stylesheet" href="../src/styles/auth.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-brand">
    <span class="brand-mark brand-mark--large"><svg class="icon" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.3-3.2"/><path d="M4.5 2.5v2.5H7"/></svg></span>
    <span>Retrace</span>
  </div>

  <form class="auth-card" method="post">
    <div class="auth-card__header">
      <h1 class="auth-card__title">Create your account</h1>
      <p class="auth-card__lede">You’ll get an API key for Claude Code right after.</p>
    </div>
    <div class="field">
      <label class="field__label" for="username">Username</label>
      <input class="input input--large" id="username" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input class="input input--large" id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input class="input input--large" id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required>
      <span class="field__hint" id="password-hint">At least 8 characters</span>
    </div>
    <button class="button button--primary button--large auth-card__submit" type="submit">Create account</button>
  </form>

  <p class="auth-switch">Already have an account? <a class="text-link" href="login.html">Sign in</a></p>
</main>
</body>
</html>
