services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retrace}
      POSTGRES_USER: ${POSTGRES_USER:-retrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retrace}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retrace}"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
